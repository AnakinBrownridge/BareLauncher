name: Android CI

on:
  push:
    branches: [ "BareLauncher-main" ]
  pull_request:
    branches: [ "BareLauncher-main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: '24'

      - name: Set up JDK 27
        uses: actions/setup-java@v4
        with:
          java-version: '27'
          distribution: 'temurin'
          cache: gradle

      - name: Verify installed toolchains
        run: |
          node --version
          java -version

      - name: Build with Gradle if a wrapper is present
        shell: bash
        run: |
          if [ -f ./gradlew ]; then
            chmod +x ./gradlew
            ./gradlew build
          else
            echo "Gradle wrapper not present in this repository; skipping Gradle build."
          fi
